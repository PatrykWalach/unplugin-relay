name: Refresh Release PRs

on:
  push:
    branches:
      - main

jobs:
  refresh-release-prs:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          sfw: true
          cache: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - run: vp run release --release patch --yes
        id: patch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: vp run release --release patch
        if: steps.patch.outcome == 'failure'

      - run: vp run release --release minor --yes
        id: minor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: vp run release --release minor
        if: steps.minor.outcome == 'failure'

      - run: vp run release --release major --yes
        id: major
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: vp run release --release major
        if: steps.major.outcome == 'failure'
